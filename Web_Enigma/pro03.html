<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro03 - Calculo de edad</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            padding: 32px 36px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            color: #1e3c72;
            font-size: 1rem;
            line-height: 1.6;
        }
        .card a {
            color: #2a5298;
            font-weight: 600;
            text-decoration: none;
        }
        .card a:hover { text-decoration: underline; }
        .volver {
            display: inline-block;
            margin-top: 18px;
            color: #2a5298;
            font-size: 0.85rem;
            font-weight: 600;
        }
</style>
</head>
<body>
    <div class="card">
    <script>

        /* ENTRADA DE DATOS */
        let anioNacimiento = Number(prompt("Ingrese su año de nacimiento: "));

        /* PROCESO DE DATOS */
        let añoActual = new Date().getFullYear();
        let edad;
        edad = añoActual - añoNacimiento;

        /* SALIDA DE DATOS */
        document.write("<strong>Calculo de edad</strong><br><br>");
        document.write("Anio actual: " + añoActual + "<br>");
        document.write("Anio de nacimiento: " + añoNacimiento + "<br>");
        document.write("Edad aproximada: " + edad + " años");
  
        document.write("<br><a class=\"volver\" href=\"index.html\">&larr; Volver al indice</a>");
    </script>
    </div>
</body>
</html>
