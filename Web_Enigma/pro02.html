<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro02 - Compra de utiles escolares</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            padding: 32px 36px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            color: #1e3c72;
            font-size: 1rem;
            line-height: 1.6;
        }
        .card a {
            color: #2a5298;
            font-weight: 600;
            text-decoration: none;
        }
        .card a:hover { text-decoration: underline; }
        .volver {
            display: inline-block;
            margin-top: 18px;
            color: #2a5298;
            font-size: 0.85rem;
            font-weight: 600;
        }
</style>
</head>
<body>
    <div class="card">
    <script>

        /* ENTRADA DE DATOS */
        let precioCuaderno = Number(prompt("Ingrese el precio de un cuaderno: "));
        let cantCuadernos = Number(prompt("Ingrese la cantidad de cuadernos: "));
        let precioLapicero = Number(prompt("Ingrese el precio de un lapicero: "));
        let cantLapiceros = Number(prompt("Ingrese la cantidad de lapiceros: "));

        /* PROCESO DE DATOS */
        let totalCuadernos;
        let totalLapiceros;
        let total;

        totalCuadernos = precioCuaderno * cantCuadernos;
        totalLapiceros = precioLapicero * cantLapiceros;
        total = totalCuadernos + totalLapiceros;

        /* SALIDA DE DATOS */
        document.write("<strong>Compra de utiles escolares</strong><br><br>");
        document.write("Total en cuadernos: S/. " + totalCuadernos + "<br>");
        document.write("Total en lapiceros: S/. " + totalLapiceros + "<br>");
        document.write("Total de la compra: S/. " + total);
  
        document.write("<br><a class=\"volver\" href=\"index.html\">&larr; Volver al indice</a>");
    </script>
    </div>
</body>
</html>
