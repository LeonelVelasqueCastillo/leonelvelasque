<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro04 - Promedio de notas</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            padding: 32px 36px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            color: #1e3c72;
            font-size: 1rem;
            line-height: 1.6;
        }
        .card a {
            color: #2a5298;
            font-weight: 600;
            text-decoration: none;
        }
        .card a:hover { text-decoration: underline; }
        .volver {
            display: inline-block;
            margin-top: 18px;
            color: #2a5298;
            font-size: 0.85rem;
            font-weight: 600;
        }
</style>
</head>
<body>
    <div class="card">
    <script>

        /* ENTRADA DE DATOS */
        let n1 = Number(prompt("Ingrese la nota 1: "));
        let n2 = Number(prompt("Ingrese la nota 2: "));
        let n3 = Number(prompt("Ingrese la nota 3: "));

        /* PROCESO DE DATOS */
        let promedio;
        promedio = (n1 + n2 + n3) / 3;

        /* SALIDA DE DATOS */
        document.write("<strong>Promedio de notas</strong><br><br>");
        document.write("Nota 1: " + n1 + "<br>");
        document.write("Nota 2: " + n2 + "<br>");
        document.write("Nota 3: " + n3 + "<br>");
        document.write("Promedio final: " + promedio);
  
        document.write("<br><a class=\"volver\" href=\"index.html\">&larr; Volver al indice</a>");
    </script>
    </div>
</body>
</html>
